name: Official Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # needed to push git tags

jobs:
  build:
    name: Version, Build, Test & Publish Artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for full git log + MinVer

      - name: Detect version bump
        id: version
        run: bash scripts/resolve-version.sh "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: bash scripts/push-version-tag.sh "${{ steps.version.outputs.tag }}"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # SDK version is read automatically from global.json

      - name: Restore
        run: bash scripts/dotnet-ci.sh restore

      - name: Build
        run: bash scripts/dotnet-ci.sh build Release
        # MinVer reads the tag pushed above → produces a clean version (e.g. 1.2.3)

      - name: Test
        timeout-minutes: 3
        continue-on-error: true
        env:
          DCP_CONTAINER_RUNTIME: docker
          DOTNET_ASPIRE_CONTAINER_RUNTIME: docker
          DOTNET_RESOURCE_SERVICE_ENDPOINT_URL: "http://127.0.0.1:0"
          ASPNETCORE_URLS: "http://+:5000"
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
        run: bash scripts/dotnet-ci.sh test Release ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results

      - name: Publish
        run: bash scripts/publish-build-artifacts.sh "${{ steps.version.outputs.version }}" ./publish Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: ./publish
          if-no-files-found: error

      # ── Deployment artifacts (nothing is deployed or pushed to Azure here) ────
      # Container images are saved as archives; the release pipeline pushes them
      # to the cell's registry, which only exists after provisioning.
      - name: Install Aspire CLI
        run: bash scripts/install-aspire-cli.sh

      # Generates Bicep from the AppHost. cellId/buildNumber become Bicep parameters (placeholders here).
      - name: Build deployment artifacts
        env:
          Parameters__cellId: placeholder
          Parameters__buildNumber: placeholder
          Parameters__frontDoorId: placeholder
          Parameters__registryName: placeholder
          Parameters__registryResourceGroup: placeholder
          Parameters__authMode: placeholder
          Parameters__authAuthority: placeholder
          Parameters__authAudience: placeholder
          Parameters__authScalarClientId: placeholder
          Parameters__authScalarScope: placeholder
          Parameters__docsEnabled: placeholder
        run: bash scripts/build-deployment-artifacts.sh "${{ steps.version.outputs.version }}" ./deploy-artifacts Release

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deploy-artifacts
          path: ./deploy-artifacts
          if-no-files-found: error
      - name: Summary
        run: bash scripts/build-summary.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}" "${{ github.run_id }}"
