name: Template Publish Pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish package to NuGet. If unchecked, only packs and uploads the artifact.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # required for NuGet Trusted Publishing (OIDC)

jobs:
  publish-template:
    name: Pack & Publish Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required by MinVer to read full git history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # SDK version is read from global.json

      - name: Restore template pack
        run: dotnet restore template-pack/Dst.AspireOrleans.Template.csproj

      - name: Read version
        id: version
        run: |
          VERSION=$(cat template-pack/VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Template version: $VERSION"

      - name: Pack template
        run: |
          dotnet pack template-pack/Dst.AspireOrleans.Template.csproj \
            --no-restore \
            --configuration Release \
            /p:Version=${{ steps.version.outputs.version }}

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: template-nupkg
          path: template-pack/nupkg/*.nupkg
          if-no-files-found: error

      - name: Show package info
        run: |
          PKG=$(ls template-pack/nupkg/*.nupkg)
          echo "### 📦 Template package" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **File** | \`$(basename $PKG)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Publish** | \`${{ inputs.publish }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: NuGet login (Trusted Publishing)
        if: ${{ inputs.publish == true }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push to NuGet
        if: ${{ inputs.publish == true }}
        run: |
          dotnet nuget push template-pack/nupkg/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Summary
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "✅ **Published to NuGet.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Publish skipped** — package was NOT pushed to NuGet." >> "$GITHUB_STEP_SUMMARY"
          fi
