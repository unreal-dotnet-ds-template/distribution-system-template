name: PR Build Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required by MinVer to read git history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # SDK version is read automatically from global.json

      - name: Restore
        run: bash scripts/dotnet-ci.sh restore

      - name: Build
        run: bash scripts/dotnet-ci.sh build Release
      
      - name: Pre-pull Redis Docker Image
        run: bash scripts/dotnet-ci.sh pull-redis redis:latest

      - name: Test
        timeout-minutes: 5
        continue-on-error: true
        env:
          DCP_CONTAINER_RUNTIME: docker
          DOTNET_ASPIRE_CONTAINER_RUNTIME: docker
          DOTNET_RESOURCE_SERVICE_ENDPOINT_URL: "http://127.0.0.1:0"
          ASPNETCORE_URLS: "http://+:5000"
          DCP_DIAGNOSTICS_LOG_LEVEL: debug
        run: bash scripts/dotnet-ci.sh test Release ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
